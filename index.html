function parseSites(text){
  const secs=[];let sec=null,grp=null;const legacy=!/^\s*(\*\*|@@)/m.test(text);
  const newSec=n=>{sec={name:n,groups:[]};secs.push(sec);grp=null};

function videoDrop(id,name,heading,rowCls,vids,auto){
  const frag=document.createDocumentFragment(),head=mk("div",rowCls);
  const btn=mk("button","vtoggle");btn.type="button";
  btn.append(mk("span","yt"),mk("span",null,"Tutorials"),mk("span","chev"));
  btn.setAttribute("aria-label","Tutorials for "+name);btn.setAttribute("aria-expanded","false");
  const pn=mk("div","vpanel"),vin=mk("div","vin"),vl=mk("div","vlist");
  pn.id=id+"-tutorials";btn.setAttribute("aria-controls",pn.id);pn.inert=true;
  vin.appendChild(vl);pn.appendChild(vin);if(heading)head.appendChild(heading);head.appendChild(btn);frag.append(head,pn);
  let filled=false,t=0;
  const set=(o,user)=>{
    clearTimeout(t);
    if(o&&!filled){vids.forEach(l=>vl.appendChild(video(l)));filled=true}
    pn.classList.toggle("open",o);pn.inert=!o;btn.setAttribute("aria-expanded",o);
    if(user)o?OPEN.add(id):OPEN.delete(id);

    if(!o)t=setTimeout(()=>{if(!pn.classList.contains("open")){vl.replaceChildren();filled=false}},500);
  };

}

function goTo(id,flash){

function browseView(out){
  SITES.forEach((s,i)=>{
    const id=slug(s.name,i),h=PAL[i%PAL.length];
    const sec=mk("section","sec");sec.id=id;sec.dataset.h=h;sec.style.setProperty("--h",h);
    const total=s.groups.reduce((n,g)=>n+g.links.length+g.videos.length,0);
    const eye=mk("div","sec-eye");eye.append(mk("span","sec-no","Section "+String(i+1).padStart(2,"0")),mk("span","sec-path","~/"+shellName(s.name)+"/"),mk("span","sec-count",total+(total===1?" item":" items")));sec.appendChild(eye);
    const h2=mk("h2",null,s.name);sec.appendChild(h2);
    s.groups.forEach((g,gi)=>{
      const gid=id+"-"+gi;
      const hd=g.name?mk("h3",null,g.name):null;if(hd)hd.id=gid;
      if(g.videos.length){
        if(hd)sec.append(videoDrop(gid,g.name,hd,"grp-head",g.videos,false));

      }else if(hd)sec.appendChild(hd);

    });

}

function closeSearch(clear){$("sres").hidden=true;if(clear)$("q").value=""}
function jump(id,name,kind,h,W,href){
  const a=mk("a","tile");a.href=href||"#"+id;a.style.setProperty("--h",h);
  const ico=mk("span","ico",name.charAt(0).toUpperCase());
  const t=mk("span","txt");t.append(put(mk("span","name"),name,W),mk("span","host",kind));
  a.append(ico,t);
  if(!href)a.onclick=e=>{e.preventDefault();closeSearch(true);requestAnimationFrame(()=>goTo(id))};
  return a;
}
function searchView(out,W,raw){
  const has=t=>{t=(t||"").toLowerCase();return W.every(w=>t.includes(w))};
  const secs=[],grps=[],links=[],vids=[];
  const add=(l,crumb,h,isVid,page)=>{
    const nm=l.title||pretty(l.url),tg=(l.tags||[]).join(" ")+(l.star?" starred":"");
    if(!has(nm+" "+(l.desc||"")+" "+l.url+" "+tg))return;
    (isVid?vids:links).push({l,crumb,h,page,sc:has(nm)?4:has(tg)?3:has(l.desc)?2:1});
  };
  SITES.forEach((s,i)=>{
    const id=slug(s.name,i),h=PAL[i%PAL.length];
    if(has(s.name))secs.push({name:s.name,id,h});
    s.groups.forEach((g,gi)=>{
      if(g.name&&has(g.name))grps.push({name:g.name,parent:s.name,id:id+"-"+gi,h});
      const crumb=g.name?s.name+" › "+g.name:s.name;
      g.links.forEach(l=>add(l,crumb,h,false));
      g.videos.forEach(l=>add(l,crumb,h,true));
    });
  });
  links.sort((a,b)=>b.sc-a.sc);vids.sort((a,b)=>b.sc-a.sc);
  if(!secs.length&&!grps.length&&!links.length&&!vids.length)
    out.appendChild(mk("p","empty","Nothing matches “"+raw+"”. Try another word."));
  const block=(title,items,build)=>{
    if(!items.length)return;out.appendChild(mk("h3",null,title));
    const g=mk("div","rows");items.forEach(x=>g.appendChild(build(x)));out.appendChild(g);
  };
  const row=x=>{const a=tile(x.l,W,x.crumb,true);a.style.setProperty("--h",x.h);if(x.page)a.href=x.page;return a};
  block("Sections",secs,x=>jump(x.id,x.name,"Section",x.h,W));
  block("Groups",grps,x=>jump(x.id,x.name,"Group in "+x.parent,x.h,W,x.href));
  block("Results",links,row);
  block("Tutorials",vids,row);
}
function runSearch(){
  const P=$("sres"),raw=$("q").value.trim(),W=raw.toLowerCase().split(/\s+/).filter(Boolean);
  P.replaceChildren();
  if(!W.length){P.hidden=true;return}
  searchView(P,W,raw);P.scrollTop=0;P.hidden=false;
}
function observe(){
  if(io)io.disconnect();if(io2)io2.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
    document.querySelectorAll(".chip").forEach(c=>{const on=c.dataset.id===e.target.id;c.classList.toggle("on",on);if(on)c.scrollIntoView({block:"nearest",inline:"center"})});
  }}),{rootMargin:"-30% 0px -60% 0px"});
  io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io2.unobserve(e.target)}}),{threshold:.08});
  document.querySelectorAll(".sec").forEach(s=>io.observe(s));
  document.querySelectorAll(".grid").forEach(g=>RM?g.classList.add("in"):io2.observe(g));
}

let PAD,RIM,PB,PX,PY,PA,PS,pctx,pw=0,ph=0,dpr=1,T0=0;
function buildPadPts(){
  // Xbox controller, sampled from its 3D model into points: x,y,z in 1/200 units (int16), then one byte each for brightness and edge flag
  const bin=atob(CLOUD),n=(bin.length/7)|0,u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const xyz=new Int16Array(u.buffer,0,n*3),fl=u.subarray(n*6),want=Math.min(n,innerWidth<700?4500:7500),pts=[];
  for(let i=0;i<want;i++){const f=fl[i];pts.push(xyz[i*3]/200,xyz[i*3+1]/200,xyz[i*3+2]/200,(f&127)/100,f>>7)}
  PAD=new Float32Array(pts);const N=PAD.length/5;
  PX=new Float32Array(N);PY=new Float32Array(N);PA=new Float32Array(N);PS=new Float32Array(N);
  RIM=[];for(let i=0;i<N;i++)if(PAD[i*5+4])RIM.push(i);
  pctx=$("pad").getContext("2d");T0=performance.now()/1000;
}
function sizePad(){const c=$("pad");dpr=Math.min(devicePixelRatio||1,1.5);pw=c.width=Math.round(c.clientWidth*dpr);ph=c.height=Math.round(c.clientHeight*dpr)}
function drawPad(t){
  if(!PAD||!pw)return;const g=pctx,N=PAD.length/5;g.globalCompositeOperation="source-over";g.clearRect(0,0,pw,ph);g.globalCompositeOperation="lighter";
  const e=RM?0:Math.exp(-(t-T0)*1.1),ay=RM?-.3:-.3+3*e,ax=.2+(RM?.08:Math.sin(t*.5)*.12+py*.1+.8*e),cy=Math.cos(ay),sy=Math.sin(ay),cx=Math.cos(ax),sx=Math.sin(ax);
  const sc=pw/230,ox=pw/2,oy=ph/2+(RM?0:Math.sin(t*.9)*4*dpr),sw=RM?1e9:((t*.45)%1)*190-95;
  for(let i=0;i<N;i++){const o=i*5,x=PAD[o],y=PAD[o+1],z=PAD[o+2];
    const x1=x*cy+z*sy,z1=-x*sy+z*cy,y1=y*cx-z1*sx,z2=y*sx+z1*cx,f=520/(520-z2);
    PX[i]=ox+x1*f*sc;PY[i]=oy-y1*f*sc;
    PA[i]=PAD[o+3]*(.3+.7*Math.min(1,Math.max(0,(z2+30)/60)))*(RM?1:.82+.18*Math.random())*(1+.5*Math.exp(-((y1-sw)*(y1-sw))/70));
    PS[i]=f*dpr*(PAD[o+4]?1.7:1.25)}
  const AB=6;if(!PB)PB=Array.from({length:AB},()=>null);
  for(let k=0;k<AB;k++)PB[k]=new Path2D();
  for(let i=0;i<N;i++){const a=PA[i];if(a<.04)continue;PB[Math.min(AB-1,(a*AB)|0)].rect(PX[i],PY[i],PS[i],PS[i])}
  g.fillStyle="#f0e6ff";for(let k=0;k<AB;k++){g.globalAlpha=Math.min(1,(k+.5)/AB);g.fill(PB[k])}
  const k=.9*dpr,pr=new Path2D(),pc=new Path2D();
  for(let j=0;j<RIM.length;j++){const i=RIM[j];pr.rect(PX[i]+k,PY[i],PS[i],PS[i]);pc.rect(PX[i]-k,PY[i],PS[i],PS[i])}
  g.globalAlpha=.16;g.fillStyle="#ff5a6e";g.fill(pr);g.fillStyle="#5affea";g.fill(pc);
  g.globalAlpha=1;
}
let heroVis=true,fr=0;
if("IntersectionObserver" in window)new IntersectionObserver(es=>{heroVis=es[0].isIntersecting}).observe($("top"));
function spin(){
  const t=performance.now()/1000;if(RM||(heroVis&&(fr++&1)===0))drawPad(t);
  stepLogos();
  if(!RM)requestAnimationFrame(spin);
}
addEventListener("scroll",()=>{
  sy=scrollY;
  if(RM)spin();
},{passive:true});
document.addEventListener("pointermove",e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5},{passive:true});

SITES=parseSites($("links").textContent);
buildPadPts();sizePad();render();spin();addEventListener("resize",()=>{sizePad();if(RM)drawPad(0)});
let qt;const Q=$("q"),P=$("sres");
Q.addEventListener("input",()=>{clearTimeout(qt);qt=setTimeout(runSearch,90)});
Q.addEventListener("focus",()=>{if(Q.value.trim())runSearch()});
Q.addEventListener("keydown",e=>{
  const first=P.querySelector("a");
  if(e.key==="Escape"){if(Q.value||!P.hidden){closeSearch(true);Q.blur()}}
  else if(e.key==="ArrowDown"&&first){e.preventDefault();first.focus()}
  else if(e.key==="Enter"&&first&&!P.hidden){e.preventDefault();first.click()}
});
P.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeSearch(true);Q.focus();return}
  if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;
  const L=[...P.querySelectorAll("a")],i=L.indexOf(document.activeElement);if(i<0)return;
  e.preventDefault();
  if(e.key==="ArrowDown")(L[i+1]||L[i]).focus();else if(i>0)L[i-1].focus();else Q.focus();
});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".search"))P.hidden=true});
